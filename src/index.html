<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#be3232" />
    <meta name="color-scheme" content="light dark" />
    <title>GoBiky</title>
    <base href="/" />
    <meta name="description" content="لوحة تحكم GoBiky لإدارة الأسطول والعمليات" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" as="image" href="assets/img/logo-mark.png" />

    <!-- Apply the saved theme before first paint (no light flash in dark mode). Keep in sync with ThemeService. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('gobike_theme');
          var d =
            p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var t = d ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.bsTheme = t;
        } catch (e) {}
      })();
    </script>

    <style>
      /* Critical inline CSS — branded boot screen painted before Angular loads */
      :root { --bg: #f5f5f7; --ring: rgba(31, 31, 33, 0.1); --brand: #be3232; }
      :root[data-theme='dark'] { --bg: #111112; --ring: rgba(255, 255, 255, 0.1); --brand: #dc4a4a; }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
        min-height: 100dvh;
        overflow: hidden;
      }
      .app-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background: var(--bg);
      }
      .app-boot__mark { width: 96px; height: auto; animation: app-boot-float 1.6s ease-in-out infinite; }
      .app-boot__bar { width: 120px; height: 3px; border-radius: 3px; background: var(--ring); overflow: hidden; }
      .app-boot__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: var(--brand);
        animation: app-boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes app-boot-float { 50% { transform: translateY(-8px); } }
      @keyframes app-boot-slide { from { transform: translateX(150%); } to { transform: translateX(-250%); } }
      @media (prefers-reduced-motion: reduce) { .app-boot__mark, .app-boot__bar::after { animation: none; } }
      app-root:not(:empty) ~ .app-boot,
      app-root:has(*) + .app-boot { display: none; }
    </style>
  </head>

  <body>
    <app-root></app-root>

    <div class="app-boot" aria-hidden="true">
      <img class="app-boot__mark" src="assets/img/logo-mark.png" alt="" width="96" height="47" />
      <span class="app-boot__bar"></span>
    </div>

    <noscript>يتطلب تشغيل لوحة تحكم GoBiky تفعيل JavaScript.</noscript>
  </body>
</html>
